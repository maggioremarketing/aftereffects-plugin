<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animador de Texto</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="panel-body">

    <!-- ── PREVISUALIZACIÓN ── -->
    <div id="preview-section">
        <div id="preview-header">
            <span>Preview</span>
            <button id="btn-replay">↺ Repetir</button>
        </div>
        <canvas id="preview-canvas"></canvas>
    </div>

    <!-- ── ENTRADA ── -->
    <div class="section">
        <div class="section-header">Entrada</div>
        <div class="section-body">
            <div class="field">
                <label>Duración (s)</label>
                <input type="number" id="introDuration" value="0.5" min="0.1" max="10" step="0.1">
            </div>
            <div class="field">
                <label>Dirección</label>
                <select id="introDirection">
                    <option>Arriba</option>
                    <option>Abajo</option>
                    <option selected>Izquierda</option>
                    <option>Derecha</option>
                </select>
            </div>
            <div class="field">
                <label>Distancia (px)</label>
                <input type="number" id="introDistance" value="60" min="0" max="500" step="5">
            </div>
            <div class="field">
                <label>Opacidad inicial (%)</label>
                <input type="number" id="introOpacity" value="0" min="0" max="100" step="5">
            </div>
            <div class="field">
                <label>Blur entrada</label>
                <input type="number" id="introBlur" value="30" min="0" max="200" step="1">
            </div>
            <div class="field">
                <label>Influence</label>
                <input type="number" id="introEaseInfluence" value="2" min="1" max="100" step="1">
            </div>
        </div>
    </div>

    <!-- ── SALIDA ── -->
    <div class="section">
        <div class="section-header">
            <label>
                <input type="checkbox" id="outroEnabled" checked>
                Salida
            </label>
        </div>
        <div class="section-body" id="outroBody">
            <div class="field">
                <label>Duración (s)</label>
                <input type="number" id="outroDuration" value="0.5" min="0.1" max="10" step="0.1">
            </div>
            <div class="field">
                <label>Dirección</label>
                <select id="outroDirection">
                    <option>Arriba</option>
                    <option>Abajo</option>
                    <option>Izquierda</option>
                    <option selected>Derecha</option>
                </select>
            </div>
            <div class="field">
                <label>Distancia (px)</label>
                <input type="number" id="outroDistance" value="60" min="0" max="500" step="5">
            </div>
            <div class="field">
                <label>Opacidad final (%)</label>
                <input type="number" id="outroOpacity" value="0" min="0" max="100" step="5">
            </div>
            <div class="field">
                <label>Blur salida</label>
                <input type="number" id="outroBlur" value="10" min="0" max="200" step="1">
            </div>
            <div class="field">
                <label>Influence</label>
                <input type="number" id="outroEaseInfluence" value="2" min="1" max="100" step="1">
            </div>
        </div>
    </div>

    <!-- ── SELECTOR ── -->
    <div class="section">
        <div class="section-header">Selector</div>
        <div class="section-body">
            <div class="field">
                <label>Based On</label>
                <select id="basedOn">
                    <option selected>Words</option>
                    <option>Characters</option>
                    <option>Characters Excluding Spaces</option>
                    <option>Lines</option>
                </select>
            </div>
            <div class="field">
                <label>Ease Low</label>
                <input type="number" id="easeLow" value="100" min="0" max="100" step="5">
            </div>
            <div class="field">
                <label>Ease High</label>
                <input type="number" id="easeHigh" value="0" min="0" max="100" step="5">
            </div>
            <div class="field">
                <label>Smoothness</label>
                <input type="number" id="smoothness" value="100" min="0" max="100" step="5">
            </div>
        </div>
    </div>

    <!-- ── STATUS + BOTONES ── -->
    <div id="status"></div>
    <div class="btn-row">
        <button class="btn btn-primary" id="btn-apply">Aplicar</button>
    </div>

</div>

<!-- CSInterface: librería de Adobe para comunicarse con AE -->
<script src="lib/CSInterface.js"></script>
<script src="js/main.js"></script>
</body>
</html>
